[metadata]
name = mantis-seg
description = Segmentation and label-image processing tasks for Fractal.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/fmi-basel/Mantis-seg
author = Nicole Repina
author_email = nicole.repina@fmi.ch
license = BSD-3-Clause
license_file = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
project_urls =
    Bug Tracker = https://github.com/fmi-basel/Mantis-seg/issues
    Documentation = https://github.com/fmi-basel/Mantis-seg#README.md
    Source Code = https://github.com/fmi-basel/Mantis-seg
    User Support = https://github.com/fmi-basel/Mantis-seg/issues

[options]
packages = find:
install_requires =
    dask==2025.9.1
    dask-image
    numpy<2
    pandas<3.0.0
    scikit-image>=0.21.0
    scipy
    anndata
    fractal-tasks-core==1.3.4
    fractal-task-tools>=0.3.0,<0.4.0
    ngio==0.2.14
python_requires = >=3.11
package_dir =
    = src
setup_requires =
    setuptools-scm

[options.packages.find]
where = src

[options.extras_require]
test =
    pytest
    pytest-cov
    pooch
    devtools

[options.package_data]
mantis_seg = __FRACTAL_MANIFEST__.json
